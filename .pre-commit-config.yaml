# Run with prek (https://prek.j178.dev/, a Rust, drop-in-compatible
# reimplementation of pre-commit — see CLAUDE.md for why) or with the
# classic `pre-commit` CLI; both read this exact file.
#
# Fast, basic checks run on every commit. Every hook also carries the
# "manual" stage, so `prek run --hook-stage manual --all-files` runs
# everything at once regardless of which git hook would normally trigger
# it. An instance layers its own language-specific hooks (ruff/mypy/
# pytest, cargo fmt/clippy, golangci-lint, eslint/tsc, tflint, ...) onto
# this file's `repos:` list — see docs/TEMPLATE.md's "Checks" section.
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit, manual]
      - id: end-of-file-fixer
        stages: [pre-commit, manual]
      - id: check-yaml
        stages: [pre-commit, manual]
      - id: check-toml
        stages: [pre-commit, manual]
      - id: check-json
        stages: [pre-commit, manual]
      - id: check-added-large-files
        stages: [pre-commit, manual]
      - id: check-merge-conflict
        stages: [pre-commit, manual]
      - id: mixed-line-ending
        stages: [pre-commit, manual]
      - id: debug-statements
        stages: [pre-commit, manual]
      - id: detect-private-key
        stages: [pre-commit, manual]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      # No "manual" stage here, unlike every other hook in this file: this
      # one needs the actual commit-message file git passes at the
      # commit-msg stage, which "prek run --all-files --hook-stage manual"
      # has no equivalent for.
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: template-sync-manifest
        name: template-sync-manifest (every tracked path classified)
        entry: python3 .github/scripts/template_sync_manifest.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: scripts-tests
        name: scripts-tests (.github/scripts unit tests, executable bits)
        entry: env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p "test_*.py"
        language: system
        files: ^(\.github/(scripts|workflows)/|\.claude/hooks/|Makefile$)
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: devcontainer-lock
        name: devcontainer-lock (lockfile matches devcontainer.json features)
        entry: python3 .github/scripts/check_devcontainer_lock.py
        language: system
        files: ^\.devcontainer/devcontainer(-lock)?\.json$
        pass_filenames: false
        stages: [pre-commit, manual]

  # The Go gates. Tools come from scripts/develop.d/10-go.sh; the
  # golangci-lint v2 flags (`run`, `fmt --diff`) and govulncheck's package
  # mode were checked against each tool's docs on context7.
  - repo: local
    hooks:
      - id: golangci-fmt
        name: golangci-lint fmt --diff (gofmt, goimports)
        entry: golangci-lint fmt --diff
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: golangci-lint
        name: golangci-lint run
        entry: golangci-lint run
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: go-mod-tidy
        name: go.mod / go.sum are tidy
        entry: go mod tidy -diff
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]

      - id: go-test-coverage
        name: go test -race (100% statement-coverage gate, COVERAGE_MIN)
        entry: scripts/go-coverage.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]

      - id: govulncheck
        name: govulncheck (known vulnerabilities in reachable code)
        # Online: reads vuln.go.dev. Fails only for a vulnerability the code
        # actually calls; the dependency scan of go.mod is osv-scanner's.
        entry: govulncheck ./...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]

      - id: release-contract-tests
        name: Makefile and scripts/release-* tests
        entry: python3 -I scripts/test_release_contract.py
        language: system
        pass_filenames: false
        files: ^(Makefile|scripts/(module-info|check-module-path|go-coverage|release-[a-z-]+)\.sh|scripts/test_release_contract\.py)$
        stages: [pre-commit, manual]

  # Supply-chain/secret scanners (OWASP A01/A03/A04/A08 -- see
  # docs/TEMPLATE.md's "Checks"). Revs are tags, not SHAs: Renovate's
  # pre-commit manager bumps tags directly, and a SHA + "# frozen: vX"
  # comment is pre-commit.ci's convention that it doesn't maintain.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      # Offline when run locally (no token); checks.yml passes GH_TOKEN
      # through to the devcontainer so CI also runs the online audits.
      - id: zizmor
        stages: [pre-commit, manual]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Staged changes only, on every commit. Config: .gitleaks.toml.
      - id: gitleaks
        stages: [pre-commit]
      # Full-history scan, only on demand / in CI. Same repo and rev, so
      # it can't drift from the hook above; the entry override drops the
      # --pre-commit/--staged flags the upstream hook passes.
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (full git history)
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        always_run: true
        stages: [manual]

  - repo: https://github.com/google/osv-scanner
    rev: v2.7.0
    hooks:
      # Online (queries osv.dev). Only runs when a supported lockfile is
      # in the file set: with none, osv-scanner exits 128 ("no packages
      # found"), which would fail lockfile-less repos like this one.
      - id: osv-scanner
        stages: [manual]
        always_run: false
        files: (^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lock|uv\.lock|poetry\.lock|pdm\.lock|Pipfile\.lock|pylock\.toml|Cargo\.lock|go\.mod|requirements[^/]*\.txt)$
